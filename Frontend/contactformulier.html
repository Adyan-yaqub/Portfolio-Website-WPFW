    <main>
        <section class="intro">
            <h1>Contact</h1>
            <p>
                Heb je een vraag of wil je contact opnemen?
                Vul dan het formulier hieronder in.
            </p>
        </section>

        <section class="formulier" aria-labelledby="formulier-titel">
            <h2 id="formulier-titel">Stuur een bericht</h2>

            <form>
                <label for="naam">Naam</label>
                <input type="text" id="naam" name="naam" required>

                <label for="email">E-mailadres</label>
                <input type="email" id="email" name="email" required>

                <label for="onderwerp">Onderwerp</label>
                <input type="text" id="onderwerp" name="onderwerp">

                <label for="bericht">Bericht</label>
                <textarea id="bericht" name="bericht" rows="6" required></textarea>

                <button type="submit">Versturen</button>
            </form>
        </section>
    </main>
