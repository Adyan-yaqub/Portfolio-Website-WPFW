    <main>


        <!-- Deze knoppen laten de bezoeker projecten filteren
             of de volgorde van de projecten veranderen.
             JavaScript bepaalt wat er gebeurt wanneer erop wordt geklikt. -->
        <div class="filter-knoppen">

            <!-- Toont alle projecten wanneer de bezoeker hierop klikt. -->
            <button type="button" id="knop-alle">Alle projecten</button>

            <!-- Toont alleen schoolprojecten wanneer hierop wordt geklikt. -->
            <button type="button" id="knop-school">Schoolproject</button>

            <!-- Toont alleen vrijetijdprojecten wanneer hierop wordt geklikt. -->
            <button type="button" id="knop-vrijetijd">Vrijetijdproject</button>

            <!-- Zet de projecten op alfabetische volgorde van hun titel. -->
            <button type="button" id="knop-sorteertitel">Sorteer op titel</button>
        </div>

        <!-- JavaScript kan hier een statusmelding tonen,
             bijvoorbeeld hoeveel projecten worden weergegeven. -->
        <p id="status" aria-live="polite"></p>

        <!-- JavaScript plaatst de projectkaarten in deze lege container.
             Het id maakt het mogelijk om deze plek vanuit JavaScript te vinden.
             De class kan worden gebruikt om de projecten met CSS vorm te geven. -->
        <div class="project-container" id="project-container"></div>
